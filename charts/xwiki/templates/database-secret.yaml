{{- $type := include "xwiki.database.type" . -}}
{{- if $type }}
{{- $db := index .Values $type -}}
{{- $fullName := include "xwiki.database.fullname" . -}}
{{- $isPostgresql := eq $type "postgresql" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "xwiki.database.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $db.auth.password | toString | b64enc | quote }}
  {{- if not $isPostgresql }}
  root-password: {{ $db.auth.rootPassword | toString | b64enc | quote }}
  {{- end }}
{{- end }}
