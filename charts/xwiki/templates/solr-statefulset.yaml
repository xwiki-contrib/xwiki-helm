{{- if .Values.solr.enabled }}
{{- $fullName := include "solr.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "solr.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.commonAnnotations }}
{{ toYaml .Values.commonAnnotations | indent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.solr.replicaCount }}
  serviceName: {{ $fullName }}
  selector:
    matchLabels:
      {{- include "solr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      # annotations:
      labels:
        {{- include "solr.labels" . | nindent 8 }}
      annotations:
        {{- if .Values.solr.podAnnotations }}
        {{ .Values.solr.podAnnotations | toYaml | indent 4 }}
        {{- end }}
    spec:
      {{- if .Values.solr.loadCores.enabled }}
      initContainers:
        - name: load-cores
          # Run by default in the XWiki image to install the cores bundled with the version of XWiki it contains
          image: {{ include "solr.loadCores.imageName" . }}
          imagePullPolicy: {{ .Values.solr.loadCores.image.pullPolicy | default .Values.image.pullPolicy }}
          env:
          {{- range .Values.solr.extraEnvVars }}
            - name: {{ .name  }}
              value: {{ .value | quote }}
          {{- end }}
            - name: SOLR_MAJOR_VERSION
              value: {{ include "solr.majorVersion" . | quote }}
          {{- if or .Values.solr.loadCores.command .Values.solr.loadCores.args }}
          {{- with .Values.solr.loadCores.command }}
          command: {{- include "xwiki.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- end }}
          {{- with .Values.solr.loadCores.args }}
          args: {{- include "xwiki.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- end }}
          {{- else }}
          command: ['/bin/sh', '-ec']
          args:
            - |
              # XWiki bundles the cores used by the embedded Solr in one of its Solr jars (which one depends on the version)
              MINIMAL_CORE="xwiki-platform-search-solr-server-core-minimal.zip"
              for jar in {{ include "xwiki.asPath" . }}/webapps/*/WEB-INF/lib/xwiki-platform-search-solr-*.jar; do
                if unzip -l "$jar" "$MINIMAL_CORE" > /dev/null 2>&1; then
                  CORES_JAR="$jar"
                  break
                fi
              done
              if [ -z "$CORES_JAR" ]; then
                echo "Failed to find the Solr cores in the XWiki image"
                exit 1
              fi
              VERSION=$(unzip -p "$CORES_JAR" META-INF/MANIFEST.MF | sed -n 's/^Implementation-Version: *//p' | tr -d '\r')
              echo "Installing the Solr cores of XWiki $VERSION found in $CORES_JAR"

              cd /tmp
              # Solr runs with a different user and writes in the cores through the group of the volume
              umask 002
              # The search core was renamed in XWiki 16.2.0
              SEARCH_CORE="xwiki-platform-search-solr-server-core-search.zip"
              if unzip -l "$CORES_JAR" "$SEARCH_CORE" > /dev/null 2>&1; then
                # Since then, XWiki also expects the cores (search one included) to be suffixed with the major version of Solr 9+
                if [ "${SOLR_MAJOR_VERSION:-8}" -ge 9 ]; then
                  SEARCH_CORE_NAME="xwiki_search_$SOLR_MAJOR_VERSION"
                  SUFFIX="_$SOLR_MAJOR_VERSION"
                fi
              else
                SEARCH_CORE="xwiki-platform-search-solr-server-core.zip"
              fi
              unzip -qqo "$CORES_JAR" "$SEARCH_CORE" "$MINIMAL_CORE" -d .

              unzip -qqo "./$SEARCH_CORE" -d "./cores/${SEARCH_CORE_NAME:-xwiki}"
              for core in events extension_index ratings; do
                unzip -qqo "./$MINIMAL_CORE" -d "./cores/xwiki_${core}${SUFFIX}"
              done
              find ./cores -user "$(id -u)" -exec chmod g+rwX {} +
          {{- end }}
          volumeMounts:
            - name: xwiki-solr-data
              mountPath: /tmp/cores
              subPath: data
          securityContext:
            runAsGroup: {{ .Values.solr.securityContext.fsGroup }}
            runAsUser: {{ .Values.solr.securityContext.fsGroup }}
      {{- end }}
      containers:
        - name: {{ printf "%s-solr" .Chart.Name }}
          image: {{ include "solr.imageName" . }}
          {{- if .Values.solr.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.solr.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ .Values.solr.image.pullPolicy }}
          {{- if ge (include "solr.majorVersion" . | int) 10 }}
          # Solr 10+ starts in SolrCloud mode by default, which cannot load the XWiki cores
          args: ["solr-foreground", "--user-managed"]
          {{- end }}
          {{- $extraEnvVarNames := list }}
          {{- range .Values.solr.extraEnvVars }}
          {{- $extraEnvVarNames = append $extraEnvVarNames .name }}
          {{- end }}
          {{- $enableModules := and (ge (include "solr.majorVersion" . | int) 9) (not (has "SOLR_MODULES" $extraEnvVarNames)) }}
          {{- if or $enableModules .Values.solr.extraEnvVars }}
          env:
          {{- if $enableModules }}
            # The search core of XWiki needs analyzers which are not part of Solr core anymore since Solr 9
            - name: SOLR_MODULES
              value: analysis-extras
          {{- end }}
          {{- range .Values.solr.extraEnvVars }}
            - name: {{ .name  }}
              value: {{ .value | quote }}
          {{- end }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.solr.service.internalPort }}
        {{- if .Values.solr.probes.customLiveness }}
          livenessProbe: {{- .Values.solr.probes.customLiveness | toYaml | nindent 12 }}
        {{- else if .Values.solr.probes.liveness.enabled }}
          livenessProbe: {{- omit .Values.solr.probes.liveness "enabled" | toYaml | nindent 12 }}
            httpGet:
              path: "/solr/admin/info/system"
              port: {{ .Values.solr.service.internalPort }}
         {{- end }}
        {{- if .Values.solr.probes.customReadiness }}
          readinessProbe: {{- .Values.solr.probes.customReadiness | toYaml | nindent 12 }}
        {{- else if .Values.solr.probes.readiness.enabled }}
          readinessProbe: {{- omit .Values.solr.probes.readiness "enabled" | toYaml | nindent 12 }}
            httpGet:
              path: "/api/node/health"
              port: {{ .Values.solr.service.internalPort }}
        {{- end }}
        {{- if .Values.solr.probes.customStartup }}
          startupProbe: {{- .Values.solr.probes.customStartup | toYaml | nindent 12 }}
        {{- else if .Values.solr.probes.startup.enabled }}
          startupProbe: {{- omit .Values.solr.probes.startup "enabled" | toYaml | nindent 12 }}
            httpGet:
              path: "/api/node/health"
              port: {{ .Values.solr.service.internalPort }}
        {{- end }}
          resources:
            {{- toYaml .Values.solr.resources | nindent 12 }}
          volumeMounts:
            - name: xwiki-solr-data
              mountPath: /var/solr/
            - name: xwiki-solr-tmp
              mountPath: /tmp
      {{- if .Values.solr.securityContext.enabled }}
      securityContext: {{- omit .Values.solr.securityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
    {{- with .Values.solr.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.solr.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.solr.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- /* The load-cores init container uses the XWiki image by default */}}
    {{- $imagePullSecrets := .Values.solr.imagePullSecrets | default list }}
    {{- if .Values.solr.loadCores.enabled }}
    {{- $imagePullSecrets = concat $imagePullSecrets (.Values.imagePullSecrets | default list) | uniq }}
    {{- end }}
    {{- if $imagePullSecrets }}
      imagePullSecrets:
      {{- range $imagePullSecrets }}
        - name: "{{ . }}"
      {{- end }}
    {{- end }}
      volumes:
        - name: xwiki-solr-tmp
          emptyDir: {}
        - name: xwiki-solr-data
          {{- if and .Values.solr.persistence.enabled .Values.solr.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ tpl .Values.solr.persistence.existingClaim $ }}
  {{- else if not .Values.solr.persistence.enabled }}
          emptyDir: {}
  {{- else }}
  volumeClaimTemplates:
    - metadata:
        name: xwiki-solr-data
        {{- if .Values.solr.persistence.annotations }}
        annotations: {{- include "xwiki.tplvalues.render" (dict "value" .Values.solr.persistence.annotations "context" $) | nindent 10 }}
        {{- end }}
        {{- if .Values.solr.persistence.labels }}
        labels: {{- include "xwiki.tplvalues.render" (dict "value" .Values.solr.persistence.labels "context" $) | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
        {{- range .Values.solr.persistence.accessModes }}
          - {{ . | quote }}
        {{- end }}
        {{- if .Values.solr.persistence.dataSource }}
        dataSource: {{- include "xwiki.tplvalues.render" (dict "value" .Values.solr.persistence.dataSource "context" $) | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.solr.persistence.size | quote }}
        {{- if .Values.solr.persistence.selector }}
        selector: {{- include "xwiki.tplvalues.render" (dict "value" .Values.solr.persistence.selector "context" $) | nindent 10 }}
        {{- end }}
        {{- include "xwiki.storageClass" (dict "persistence" .Values.solr.persistence "global" .Values.global) | nindent 8 }}
  {{- end }}
{{- end }}
