{{- $type := include "xwiki.database.type" . -}}
{{- if $type }}
{{- $db := index .Values $type -}}
{{- $fullName := include "xwiki.database.fullname" . -}}
{{- $isPostgresql := eq $type "postgresql" -}}
{{- /* Prefix of the environment variables understood by the official image */ -}}
{{- $envPrefix := ternary "POSTGRES" (upper $type) $isPostgresql -}}
{{- $probeCommand := include "xwiki.database.probeCommand" . -}}
{{- $pgMajor := "" -}}
{{- if $isPostgresql -}}
{{- $pgMajor = include "xwiki.postgresql.major" . -}}
{{- end -}}
{{- /* Up to PostgreSQL 17 the image declares /var/lib/postgresql/data as a volume, inside the volume of the data */ -}}
{{- $pgMaskImageVolume := and $isPostgresql (lt (int $pgMajor) 18) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "xwiki.database.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $fullName }}
  selector:
    matchLabels:
      {{- include "xwiki.database.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "xwiki.database.labels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.imagePullSecrets }}
        - name: "{{ . }}"
      {{- end }}
      {{- end }}
      {{- with $db.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $type }}
          image: {{ include "xwiki.database.image" . | quote }}
          imagePullPolicy: {{ $db.image.pullPolicy }}
          {{- with $db.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if not $isPostgresql }}
          args:
            # Keep the data in a sub directory of the volume, like PostgreSQL (see PGDATA) and the Bitnami charts used
            # by the previous versions of the chart
            - --datadir=/var/lib/mysql/data
            {{- with $db.args }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- else if $db.args }}
          args:
            {{- toYaml $db.args | nindent 12 }}
          {{- end }}
          env:
            - name: {{ $envPrefix }}_USER
              value: {{ $db.auth.username | quote }}
            - name: {{ $envPrefix }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}
                  key: password
            {{- if $isPostgresql }}
            - name: POSTGRES_DB
              value: {{ $db.auth.database | quote }}
            {{- with $db.initdbArgs }}
            - name: POSTGRES_INITDB_ARGS
              value: {{ . | quote }}
            {{- end }}
            # The layout of the official image since PostgreSQL 18, for all the versions: a directory per major version
            # in the volume, so that the clusters of two majors coexist during an upgrade with pg_upgrade (see
            # files/migrations). As a sub directory of the volume, it also avoids the lost+found and the permissions of
            # the root of a volume.
            - name: PGDATA
              value: {{ include "xwiki.postgresql.dataDir" . }}
            {{- else }}
            - name: {{ $envPrefix }}_DATABASE
              value: {{ $db.auth.database | quote }}
            - name: {{ $envPrefix }}_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}
                  key: root-password
            {{- if eq $type "mariadb" }}
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
            {{- end }}
            {{- end }}
          ports:
            - name: {{ $type }}
              containerPort: {{ include "xwiki.database.port" . }}
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", {{ $probeCommand | quote }}]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", {{ $probeCommand | quote }}]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", {{ $probeCommand | quote }}]
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with $db.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ ternary "/var/lib/postgresql" "/var/lib/mysql" $isPostgresql }}
              {{- with $db.persistence.subPath }}
              subPath: {{ . }}
              {{- end }}
            {{- if $pgMaskImageVolume }}
            - name: image-volume-mask
              # Up to PostgreSQL 17 the image declares this path as a volume: without a mount exactly there, the
              # container runtime (e.g. containerd) mounts an ephemeral volume on it, inside the volume of the data
              mountPath: /var/lib/postgresql/data
            {{- end }}
            {{- if $db.initdbScripts }}
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            {{- end }}
      {{- if or $db.initdbScripts (not $db.persistence.enabled) $pgMaskImageVolume }}
      volumes:
        {{- if $db.initdbScripts }}
        - name: initdb
          configMap:
            name: {{ $fullName }}-initdb
        {{- end }}
        {{- if $pgMaskImageVolume }}
        - name: image-volume-mask
          emptyDir: {}
        {{- end }}
        {{- if not $db.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- end }}
  {{- if $db.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml $db.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ $db.persistence.size | quote }}
        {{- include "xwiki.storageClass" (dict "persistence" $db.persistence "global" .Values.global) | nindent 8 }}
  {{- end }}
{{- end }}
