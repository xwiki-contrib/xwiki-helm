suite: test database
templates:
  - database-secret.yaml
  - database-configmap.yaml
  - database-service.yaml
  - database-statefulset.yaml
release:
  name: release
tests:
  - it: should deploy the official mysql image by default
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: release-mysql
        documentSelector:
          path: kind
          value: Service
      - equal:
          path: spec.template.spec.containers[0].image
          value: mysql:8.4
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /var/lib/mysql
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: --datadir=/var/lib/mysql/data
        documentSelector:
          path: kind
          value: StatefulSet
  - it: should allow to choose the mariadb version
    set:
      mysql.enabled: false
      mariadb.enabled: true
      mariadb.image.tag: "11.8"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: mariadb:11.8
        documentSelector:
          path: kind
          value: StatefulSet
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MARIADB_AUTO_UPGRADE
            value: "1"
        documentSelector:
          path: kind
          value: StatefulSet
  - it: should deploy postgresql without root password nor init scripts
    set:
      mysql.enabled: false
      postgresql.enabled: true
    asserts:
      - hasDocuments:
          count: 0
        template: database-configmap.yaml
      - notExists:
          path: data.root-password
        documentSelector:
          path: kind
          value: Secret
      - equal:
          path: spec.template.spec.containers[0].image
          value: postgres:17
        documentSelector:
          path: kind
          value: StatefulSet
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGDATA
            value: /var/lib/postgresql/17/docker
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /var/lib/postgresql
        documentSelector:
          path: kind
          value: StatefulSet
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: image-volume-mask
            mountPath: /var/lib/postgresql/data
        documentSelector:
          path: kind
          value: StatefulSet
      - contains:
          path: spec.template.spec.volumes
          content:
            name: image-volume-mask
            emptyDir: {}
        documentSelector:
          path: kind
          value: StatefulSet
      - notExists:
          path: spec.template.spec.containers[0].args
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.ports[0].port
          value: 5432
        documentSelector:
          path: kind
          value: Service
  - it: should use the layout of the image since postgresql 18 without masking its volume
    set:
      mysql.enabled: false
      postgresql.enabled: true
      postgresql.image.tag: "18.1-alpine"
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGDATA
            value: /var/lib/postgresql/18/docker
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: image-volume-mask
            mountPath: /var/lib/postgresql/data
      - notExists:
          path: spec.template.spec.volumes
  - it: should require the major version of postgresql when the tag does not give it
    set:
      mysql.enabled: false
      postgresql.enabled: true
      postgresql.image.tag: latest
    template: database-statefulset.yaml
    asserts:
      - failedTemplate:
          errorPattern: postgresql.image.majorVersion is required
  - it: should use the major version of postgresql set explicitly
    set:
      mysql.enabled: false
      postgresql.enabled: true
      postgresql.image.tag: latest
      postgresql.image.majorVersion: 18
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGDATA
            value: /var/lib/postgresql/18/docker
  - it: should support disabling the persistence and using a sub path
    set:
      mysql.persistence.enabled: false
      mysql.persistence.subPath: data
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].subPath
          value: data
        documentSelector:
          path: kind
          value: StatefulSet
  - it: should not deploy anything with an external database
    set:
      mysql.enabled: false
    asserts:
      - hasDocuments:
          count: 0
