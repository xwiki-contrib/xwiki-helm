suite: test solr statefulset
templates:
  - solr-statefulset.yaml
  - solr-service.yaml
tests:
  - it: enable solr external instance, check default value
    set:
      solr.enabled: true
    asserts:
      - isKind:
          of: StatefulSet
        template: solr-statefulset.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: xwiki-solr-tmp
              emptyDir: {}
            - name: xwiki-solr-data
        template: solr-statefulset.yaml
      - equal:
          path: spec.type
          value: ClusterIP
        template: solr-service.yaml
      - equal:
          path: spec.ports[0].port
          value: 8983
        template: solr-service.yaml
      - equal:
          path: spec.ports[0].targetPort
          value: 8983
        template: solr-service.yaml
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: xwiki-solr-tmp
              emptyDir: {}
            - name: xwiki-solr-data
        template: solr-statefulset.yaml
  - it: change service values
    set:
      solr:
        enabled: true
        service:
          type: LoadBalancer
          name: my-solr-service
          externalPort: 6060
          internalPort: 7070
          sessionAffinity: None
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
        template: solr-service.yaml
      - equal:
          path: spec.ports[0].port
          value: 6060
        template: solr-service.yaml
      - equal:
          path: spec.ports[0].targetPort
          value: 7070
        template: solr-service.yaml
      - equal:
          path: spec.ports[0].name
          value: my-solr-service
        template: solr-service.yaml
      - equal:
          path: spec.sessionAffinity
          value: None
        template: solr-service.yaml

  - it: test volume persistence
    set:
      solr.enabled: true
      solr.persistence.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.volumes[1]
          value:
            name: xwiki-solr-data
        template: solr-statefulset.yaml
  - it: test persistence
    set:
      solr:
        enabled: true
        persistence:
          enabled: true
          existingClaim: my-claim
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: xwiki-solr-tmp
              emptyDir: {}
            - name: xwiki-solr-data
              persistentVolumeClaim:
                claimName: my-claim
        template: solr-statefulset.yaml
  - it: should install the cores from the XWiki image
    set:
      solr.enabled: true
      solr.image.tag: 9.8.1
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: xwiki:lts-mysql-tomcat
        template: solr-statefulset.yaml
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: SOLR_MAJOR_VERSION
            value: "9"
        template: solr-statefulset.yaml
  - it: should use the custom XWiki image and its pull secrets to install the cores
    set:
      solr.enabled: true
      image.tag: custom
      imagePullSecrets:
        - xwiki-registry
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: xwiki:custom
        template: solr-statefulset.yaml
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: xwiki-registry
        template: solr-statefulset.yaml
  - it: should allow to load the cores with a custom image and command
    set:
      solr.enabled: true
      solr.loadCores.image.registry: registry.example.com
      solr.loadCores.image.repository: tools/xwiki-cores
      solr.loadCores.image.tag: "1.0"
      solr.loadCores.image.pullPolicy: Always
      solr.loadCores.command: ["/bin/load-cores"]
      solr.loadCores.args: ["--solr-version", '{{ include "solr.majorVersion" . }}']
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: registry.example.com/tools/xwiki-cores:1.0
        template: solr-statefulset.yaml
      - equal:
          path: spec.template.spec.initContainers[0].imagePullPolicy
          value: Always
        template: solr-statefulset.yaml
      - equal:
          path: spec.template.spec.initContainers[0].command
          value: ["/bin/load-cores"]
        template: solr-statefulset.yaml
      - equal:
          path: spec.template.spec.initContainers[0].args
          value: ["--solr-version", "9"]
        template: solr-statefulset.yaml
  - it: should not load the cores when disabled
    set:
      solr.enabled: true
      solr.loadCores.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
        template: solr-statefulset.yaml
  - it: should not customize the start of Solr 8
    set:
      solr.enabled: true
      solr.image.tag: 8.11.4-slim
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args
        template: solr-statefulset.yaml
      - notExists:
          path: spec.template.spec.containers[0].env
        template: solr-statefulset.yaml
  - it: should enable the analysis-extras module with Solr 9
    set:
      solr.enabled: true
      solr.image.tag: 9.10.1
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args
        template: solr-statefulset.yaml
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: SOLR_MODULES
              value: analysis-extras
        template: solr-statefulset.yaml
  - it: should start Solr 10 in user managed mode
    set:
      solr.enabled: true
      solr.image.tag: custom
      solr.majorVersion: 10
      solr.extraEnvVars:
        - name: SOLR_MODULES
          value: analysis-extras,langid
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["solr-foreground", "--user-managed"]
        template: solr-statefulset.yaml
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: SOLR_MODULES
              value: analysis-extras,langid
        template: solr-statefulset.yaml
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: SOLR_MAJOR_VERSION
            value: "10"
        template: solr-statefulset.yaml
  - it: test affinity, selector and tolerations
    set:
      solr.enabled: true
      solr.nodeSelector:
        disktype: ssd
        cputype: arm
      solr.tolerations:
        - key: "java8"
          operator: "Exists"
          effect: "NoSchedule"
      solr.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: disktype
                operator: In
                values:
                - ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            disktype: ssd
            cputype: arm
        template: solr-statefulset.yaml
      - equal:
          path: spec.template.spec.tolerations[0]
          value:
              key: "java8"
              operator: "Exists"
              effect: "NoSchedule"
        template: solr-statefulset.yaml
      - equal:
          path: spec.template.spec.affinity
          value:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                  - matchExpressions:
                    - key: disktype
                      operator: In
                      values:
                      - ssd
        template: solr-statefulset.yaml



