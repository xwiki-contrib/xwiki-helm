# Default values for node.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

cluster:
  enabled: false
  replicas: 1
  jgroups:
    port: 7800
    kube_ping:
      version: "2.0.1.Final"
      url: "https://nexus.xwiki.org/nexus/service/local/repositories/central/content/org/jgroups/kubernetes/jgroups-kubernetes/${KUBEPING_VERSION}/jgroups-kubernetes-${KUBEPING_VERSION}.jar"

commonAnnotations: {}

image:
  name: xwiki
  pullPolicy: IfNotPresent
## Image Tag useful when externalDB is been used
  tag: ''
service:
  annotations: {}
  portName: node
  name: http
  type: ClusterIP
  externalPort: 80
  internalPort: 8080
  # Set an array of externalIPs for the service
  externalIPs: []
    # - 10.20.30.40
    # - 10.20.30.41
  # Reference: https://kubernetes.io/docs/reference/networking/virtual-ips/#session-affinity
  sessionAffinity: ClientIP
serviceAccount:
  annotations: {}
resources: {}
#  limits:
#    cpu: 2000m
#    memory: 2000Mi
#  requests:
#    cpu: 500m
#    memory: 768Mi

podAnnotations: {}

javaOpts: []
#  - "-Xmx1024m"

# Secrets for any given Java option
javaOptsSecrets:
  # The option will be included in the environment variable JAVA_OPTS and is mandatory.
  # The following example will create and include -Djavax.net.ssl.trustStorePassword=${TRUSTSTOREPASSWORD} in the JAVA_OPTS environment variable
  # trustStorePassword:
  #   option: "-Djavax.net.ssl.trustStorePassword="
  #   # -- Superadmin password as plain value (fallback if no secret exists inside of Kubernetes).
  #   value: "testvalue"
  #   # Superadmin password from existing secret (higher precedence than plain value)
  #   secret:
  #     # -- Name of the Kubernetes secret that contains the superadmin password
  #     name: "secretname"
  #     # -- Key inside the Kubernetes secret that contains the superadmin password
  #     key: "keyinsecret"

extraEnvVars: []
#  - name: FOO
#    value: "bar"

# Optionally specify an extra list of additional volumes.
extraVolumes: []

# Optionally specify an extra list of additional volumeMounts.
extraVolumeMounts: []

# Enable to choose witch kind of workload will be used: (true) StatefulSet or (false) for Deployment
workloadStateful: true

securityContext:
  enabled: false
  fsGroup: 101

containerSecurityContext:
  enabled: false
  runAsUser: 100
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
    - ALL
  seccompProfile:
    type: "RuntimeDefault"

volumePermissions:
  # Security context of the xwiki-data-permissions init container. It runs
  # 'chown' on the data volume, so it needs to run as root and to keep the
  # CHOWN capability (DAC_OVERRIDE is needed to traverse directories that are
  # not world readable).
  containerSecurityContext:
    enabled: true
    runAsUser: 0
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop:
      - ALL
      add:
      - CHOWN
      - DAC_OVERRIDE
    seccompProfile:
      type: "RuntimeDefault"
  enabled: false

##
## MySQL configuration, deployed from the official image
##
## https://hub.docker.com/_/mysql
##
mysql:
 ## Whether to deploy a mysql server. Set false for a different database.
  enabled: true
  image:
    repository: mysql
    # The tag controls the version in use: a floating "major.minor" tag follows the patch releases of that series,
    # use a full version to pin it.
    # MySQL upgrades the data directory by itself when started with a newer version, downgrades are not supported.
    tag: "8.4"
    pullPolicy: IfNotPresent
  auth:
    rootPassword: "xwiki"
    username: "xwiki"
    password: "xwiki"
    database: "xwiki"
  # Extra arguments for the server, see https://hub.docker.com/_/xwiki
  args:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_bin
    - --explicit-defaults-for-timestamp=1
  # Scripts executed the first time the database is initialized
  initdbScripts:
    00-init.sql: |
      grant all privileges on *.* to xwiki@'%'
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    # Sub path of the volume holding the data directory (e.g. "data" to reuse a volume created by the Bitnami charts)
    subPath: ""
  resources: {}
  # The official images run with uid/gid 999
  podSecurityContext:
    fsGroup: 999
  containerSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: "RuntimeDefault"

##
## MariaDB configuration, deployed from the official image
##
## https://hub.docker.com/_/mariadb
##
mariadb:
 ## Whether to deploy a mariadb server. Set false for a different database.
  enabled: false
  image:
    repository: mariadb
    # The tag controls the version in use: a floating "major.minor" tag follows the patch releases of that series,
    # use a full version to pin it.
    # The data directory is upgraded by the image (MARIADB_AUTO_UPGRADE) when started with a newer version, downgrades are not supported.
    tag: "11.4"
    pullPolicy: IfNotPresent
  auth:
    rootPassword: "xwiki"
    username: "xwiki"
    password: "xwiki"
    database: "xwiki"
  # Extra arguments for the server, see https://hub.docker.com/_/xwiki
  args:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_bin
    - --explicit-defaults-for-timestamp=1
  # Scripts executed the first time the database is initialized
  initdbScripts:
    00-init.sql: |
      grant all privileges on *.* to xwiki@'%'
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    # Sub path of the volume holding the data directory (e.g. "data" to reuse a volume created by the Bitnami charts)
    subPath: ""
  resources: {}
  # The official images run with uid/gid 999
  podSecurityContext:
    fsGroup: 999
  containerSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: "RuntimeDefault"

##
## PostgreSQL configuration, deployed from the official image
##
## https://hub.docker.com/_/postgres
##
postgresql:
 ## Whether to deploy a postgresql server. Set false for a different database.
  enabled: false
  image:
    repository: postgres
    # The tag controls the version in use: a floating major tag follows the minor releases of that major,
    # use a full version to pin it.
    # PostgreSQL does NOT upgrade the data directory between majors: changing the major on an existing volume
    # requires a dump/restore (or pg_upgrade) and the server refuses to start otherwise.
    tag: "17"
    pullPolicy: IfNotPresent
  auth:
    # The user is created as superuser of the instance
    username: "xwiki"
    password: "xwiki"
    database: "xwiki"
  args: []
  initdbArgs: "--encoding=UTF8 --locale-provider=builtin --locale=C.UTF-8"
  # Scripts executed the first time the database is initialized
  initdbScripts: {}
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    # Sub path of the volume holding the data directory (e.g. "data" to reuse a volume created by the Bitnami charts)
    subPath: ""
  resources: {}
  # The official images run with uid/gid 999
  podSecurityContext:
    fsGroup: 999
  containerSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: "RuntimeDefault"

##
## For custom mysql and postgres database. Use externalDB.
## Would be used only if postgres and mysql is disabled.
## Set the image tag if want to use externalDB
##
externalDB:
  password: ''
  user: ''
  database: ''
  host: ''
  # To set if database init containers are enabled, supported values are mysql, postgresql, mariadb
  type: ''
  # If set to true default secret will not be created, use custom secret
  customKeyRef:
    enabled: false
    name: ''
    key: ''

##
## To use external solr enable solr, provide host and port
##
solr:
  # If set to false mount an internal Solr instance
  enabled: false
  replicaCount: 1
  image:
    registry: ""
    repository: solr
    tag: 8.11.4-slim
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  extraEnvVars: []
    # - name: FOO
    #   value: "bar"
  resources: {}
  # Init container (using the XWiki image) installing the Solr cores bundled with the version of XWiki in use
  downloadCores:
    enabled: true
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    privileged: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # Pod-level fsGroup, also applied to the download-cores init container's
  # runAsUser/runAsGroup so it can write into the fsGroup-owned cores dir.
  # Mirrors the top-level securityContext.fsGroup convention.
  securityContext:
    enabled: true
    fsGroup: 1001
  service:
    annotations: {}
    portName: solr-node
    name: http
    type: ClusterIP
    externalPort: 8983
    internalPort: 8983
    sessionAffinity: ClientIP
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: "500Mi"
    annotations: {}
    labels: {}
    selector: {}
    dataSource: {}
  podAnnotations: {}
  nodeSelector: {}
  affinity: {}
  tolerations: {}
  probes:
    customLiveness: {}
    customReadiness: {}
    customStartup: {}
    liveness:
      enabled: true
      initialDelaySeconds: 40
      periodSeconds: 10
      timeoutSeconds: 15
      failureThreshold: 6
      successThreshold: 1
    readiness:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 15
      failureThreshold: 6
      successThreshold: 1
    startup:
      enabled: true
      initialDelaySeconds: 40
      periodSeconds: 10
      timeoutSeconds: 15
      failureThreshold: 15
      successThreshold: 1

# To use ingress for routing set ingress.enabled value to true and istio.enabled value to false
ingress:
  enabled: false
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/session-cookie-name: XNGINX
    nginx.ingress.kubernetes.io/session-cookie-expires: "1800"
    # kubernetes.io/tls-acme: "true"
    # ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: secret-tls
  #    hosts:
  #      - xwiki.local

# To use istio for routing set istio.enabled value to true and ingress.enabled value to false
istio:
  enabled: false
  host: "*"
  httpCookie:
    name: xistio
    path: /
    ttl: 1800s
  externalGatewayName: ""
  gateway:
    enabled: false
    # `ingress` is used on new helm intalls, otherwise use `ingressgateway`
    selectorIstio: ingress
  tls:
    enabled: false
    httpsRedirect: true
    secretName: ""
    minProtocolVersion: "TLSV1_2"
    mode: "SIMPLE"
    certificate:
      # Generate certificate (cert-manager)
      enabled: false
      namespace: istio-ingress
      issuerRef: {}
      #  name: issuer
      #  kind: ClusterIssuer


persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: "500Mi"
  annotations: {}
  labels: {}
  selector: {}
  dataSource: {}
  customVolume: {}

